    const AudioContext = window.AudioContext || window.webkitAudioContext;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, type, duration, startTime) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + startTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + startTime + duration);
        osc.stop(audioCtx.currentTime + startTime + duration);
    }

    function playDingDong() {
        initAudio();
        playTone(659.25, 'sine', 0.5, 0);       
        playTone(523.25, 'sine', 0.5, 0.4);

        let newArr = [...array];
        for (let i = newArr.length - 1; i > 0; i--) {

        }

    function getLevelUpPopupMessage(level) {
        if (level <= 5) return `[레벨 ${level} 달성]\n우리말 어휘력이 쑥쑥! 시작이 반이에요! 🌟`;
        if (level <= 20) return `[레벨 ${level} 달성]\n와... 다의어 마스터의 기운이 느껴집니다! 🧠🔥`;
        return `[레벨 ${level} 달성]\n당신의 언어 감각, 국어 선생님도 울고 가겠어요! 👏👑`;
    }

    function generateQuestion() {
        messageDisplay.innerText = "";
        progressDisplay.innerText = `현재 레벨 진행도: ${currentQuestionCount} / ${questionsToAnswer}`;
        
        /* ✨ 단어 고유 리스트가 바닥났을 경우 결과 리포트 팝업 작동 */
        if (uniqueWordList.length === 0) {
            compileAndShowReport();
            return;
        }

        /* 💡 셔플된 단어 풀에서 단어 1개 추출 (단어 자체의 중복 원천 차단) */
        const targetWord = uniqueWordList.pop();
        hanjaDisplay.innerHTML = `${targetWord}`;

        // 💡 현재 출제된 단어가 가진 모든 올바른 의미 추출
        const targetEntries = fullDifficultyDB.filter(item => item.hanja === targetWord);
        const correctMeanings = targetEntries.map(item => item.meaning);

        currentQuestionInfo.hanja = targetWord;
        currentQuestionInfo.correctMeanings = correctMeanings;

        // 💡 오답 선지 생성: 이 단어의 뜻이 '아닌' 다른 단어의 의미 1개 무작위 추출 -> 이게 사용자가 골라야 할 진짜 정답(선지)이 됨
        const otherEntries = polysemyDB.filter(item => !correctMeanings.includes(item.meaning));
        const chosenWrongEntry = otherEntries[Math.floor(Math.random() * otherEntries.length)];
        currentCorrectAnswer = chosenWrongEntry.meaning;

        // 💡 보기 구성: 현재 단어의 진짜 뜻들 + 다른 단어의 뜻(틀린 설명 1개) 결합
        let options = [...correctMeanings, currentCorrectAnswer];
        options = shuffleArray(options);

        optionsContainer.innerHTML = "";
        options.forEach(optionText => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = optionText;
            btn.onclick = () => checkAnswer(optionText);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedOption) {
        /* 💡 사용자가 단어의 뜻이 '아닌 설명(오답)'을 골랐을 때 정답 처리됨 */
        const isCorrect = (selectedOption === currentCorrectAnswer);
        
        // 📝 오답노트 구성을 위한 학습 히스토리 누적
        // 역발상 퀴즈의 통일성을 위해 포맷 유도: '정답' 필드에는 이 단어의 올바르지 않은 뜻(정답 선지)을 바인딩
        quizHistory.push({
            questionText: currentQuestionInfo.hanja,
            userChoice: selectedOption,
            correctValue: currentCorrectAnswer,
            isCorrect: isCorrect,
            correctMeaningsString: currentQuestionInfo.correctMeanings.join(', ')
        });

        isModalCorrectState = isCorrect;
        isLevelUpPending = false;

        const modal = document.getElementById("result-popup");
        const cardInner = document.getElementById("result-card-inner");
        const iconNode = document.getElementById("result-icon");
        const textNode = document.getElementById("result-message");

        if (isCorrect) {
            playDingDong(); 
            cardInner.className = "result-content correct-style";
            iconNode.innerText = "✔️";
            textNode.innerText = "정답입니다! 단어 천재! 💕";
            
            // 진급 임계치 사전 충족 연산
            if (currentQuestionCount + 1 >= questionsToAnswer) {
                isLevelUpPending = true;
            }
        } else {
            playBeepBeep(); 
            cardInner.className = "result-content incorrect-style";
            iconNode.innerText = "❌";
            /* 💡 [요구사항 반영] 오답 팝업창 내부에 사용자가 납득할 수 있도록 오답의 원인(진짜 뜻 목록)을 표시 */
            textNode.innerHTML = `앗! 틀렸어요. 😢<br><br><span style="font-size:14px; display:block; color:#666;">'${currentQuestionInfo.hanja}'의 올바른 뜻은</span><span style="color:#2e7d32; font-size:15px; display:block; margin: 5px 0;">[ ${currentQuestionInfo.correctMeanings.join(' / ')} ]</span> 입니다.`;
        }

        modal.style.display = "flex";
    }

    /* ✨ 정답/오답/레벨업 팝업 내부 확인 버튼 클릭 시 실질적 내부 트리거 바인딩부 */
    function handleResultModalConfirm() {
        if (isModalCorrectState) {
            currentQuestionCount++;
            
            // 확인 창을 닫는 순간, 레벨업 수치가 만족되었다면 전용 비주얼 테마 모달로 내부 리모델링 스위칭
            if (isLevelUpPending) {
                isLevelUpPending = false; // 진급 보류 플래그 초기화
                currentLevel++;
                questionsToAnswer = currentLevel;
                currentQuestionCount = 0;

                const cardInner = document.getElementById("result-card-inner");
                const iconNode = document.getElementById("result-icon");
                const textNode = document.getElementById("result-message");
                const actionBtn = document.getElementById("result-action-btn");

                cardInner.className = "result-content level-up-style";
                iconNode.innerText = "🎉";
                textNode.innerText = getLevelUpPopupMessage(currentLevel);
                
                actionBtn.setAttribute("onclick", "handleLevelUpModalConfirm()");
                return; // 창을 유지한 채 실행 흐름 리턴
            }
            generateQuestion();
        } else {
            currentQuestionCount = 0;
            generateQuestion();
        }
        document.getElementById("result-popup").style.display = "none";
    }

    /* ✨ 레벨업 전환창 전용 확인 동기화 처리 핸들러 */
    function handleLevelUpModalConfirm() {
        const actionBtn = document.getElementById("result-action-btn");
        document.getElementById("result-popup").style.display = "none";
        
        // 버튼 트리거 이벤트를 기본 정오답 핸들러 상태로 다시 롤백 복원
        actionBtn.setAttribute("onclick", "handleResultModalConfirm()");
        const currentDifficultyText = levelDisplay.innerText.split(' - ')[0];
        levelDisplay.innerText = `${currentDifficultyText} - Level ${currentLevel}`;
        generateQuestion();
    }

    /* 📊 단원 소진 시 성적표 빌드 및 화면 모달 렌더링 핸들러 */
    function compileAndShowReport() {
        document.getElementById("app").style.display = "none";

        const totalQuestions = quizHistory.length;
        const correctCount = quizHistory.filter(item => item.isCorrect).length;
        const failedCount = totalQuestions - correctCount;
        const scoreValue = Math.round((correctCount / totalQuestions) * 100);

        // 시간 측정 엔진 연산
        const endTime = new Date();
        const diffMs = endTime - quizStartTime;
        const totalSec = Math.floor(diffMs / 1000);
        const minPart = Math.floor(totalSec / 60);
        const secPart = totalSec % 60;
        const timeString = minPart > 0 ? `${minPart}분 ${secPart}초` : `${secPart}초`;

        // 오답노트 파싱 및 큐 메모리 할당
        incorrectQueue = [];
        let failedNotesHtml = "";
        let failedNotesText = "";
        let failedIdxCounter = 1;

        quizHistory.forEach((record) => {
            if (!record.isCorrect) {
                // 오답 재풀이용 대상을 고유 단어명으로 수집
                if (!incorrectQueue.includes(record.questionText)) {
                    incorrectQueue.push(record.questionText);
                }

                failedNotesHtml += `${failedIdxCounter}번 : [${record.questionText}] 뜻이 아닌 것은?<br>내 답 : <span style="color:#e53935;">${record.userChoice}</span><br>정답 : <span style="color:#4caf50;">${record.correctValue}</span><br><span style="font-size:13px; color:#777;">(진짜 뜻: ${record.correctMeaningsString})</span><br><br>`;
                failedNotesText += `${failedIdxCounter}번 : [${record.questionText}] 뜻이 아닌 것은?\n내 답 : ${record.userChoice}\n정답 : ${record.correctValue}\n(진짜 뜻: ${record.correctMeaningsString})\n\n`;
                failedIdxCounter++;
            }
        });

        if (failedCount === 0) {
            failedNotesHtml = "🎉 틀린 문제가 없습니다! 완벽합니다.";
            failedNotesText = "🎉 틀린 문제가 없습니다! 완벽합니다.\n";
            document.getElementById("report-retry-failed-btn").style.display = "none";
        } else {
            document.getElementById("report-retry-failed-btn").style.display = "block";
        }

        // 화면 표출 레이아웃 양식 동적 기입
        let displayHtml = `점수 : <b>${scoreValue}점</b><br>`;
        displayHtml += `총 문제 : ${totalQuestions}<br>`;
        displayHtml += `정답 : <span style="color:#4caf50; font-weight:bold;">${correctCount}</span><br>`;
        displayHtml += `오답 : <span style="color:#e53935; font-weight:bold;">${failedCount}</span><br><br>`;
        displayHtml += `⏱️ 학습 시간 : ${timeString}<br>`;
        displayHtml += `────────────────<br><br>`;
        displayHtml += `📕 오답노트<br><br>${failedNotesHtml}`;

        document.getElementById("report-text-area").innerHTML = displayHtml;

        // 클립보드 내보내기용 원본 카카오톡 문자열 조합 고정
        finalReportText = `🏆 학습 결과\n\n`;
        finalReportText += `점수 : ${scoreValue}점\n`;
        finalReportText += `총 문제 : ${totalQuestions}\n`;
        finalReportText += `정답 : ${correctCount}\n`;
        finalReportText += `오답 : ${failedCount}\n\n`;
        finalReportText += `⏱️ 학습 시간 : ${timeString}\n`;
        finalReportText += `────────────────\n\n`;
        finalReportText += `📕 오답노트\n\n${failedNotesText}`;
        finalReportText += `────────────────\n카카오톡 대화방에 붙여넣어 공유해보세요! 💕`;

        document.getElementById("report-popup").style.display = "flex";
    }

    /* 🟢 결과 리포트 제어용 액션 콜백 패키지 */
    function actionConfirmAndCopy() {
        navigator.clipboard.writeText(finalReportText).then(() => {
            alert("📋 결과 리포트가 클립보드에 복사되었습니다!\n카카오톡 대화방에 붙여넣기(Ctrl+V) 하여 붙여넣으세요! 💕");
        }).catch(err => {
            console.error("클립보드 연동 실패: ", err);
        });
    }

    function actionPlayIncorrectOnly() {
        if (incorrectQueue.length === 0) return;
        document.getElementById("report-popup").style.display = "none";
        
        quizHistory = [];
        // 오답 고유 단어 목록을 베이스로 새 셔플 세션 빌드
        uniqueWordList = [...incorrectQueue].sort(() => 0.5 - Math.random());
        
        document.getElementById("app").style.display = "block";
        currentLevel = 1; 
        questionsToAnswer = 1; 
        currentQuestionCount = 0;
        document.getElementById("level-display").innerText = `${currentSelectedDiff} (오답재풀이) - Level 1`;
        
        quizStartTime = new Date();
        generateQuestion();
    }

    function actionRestartFullQuiz() {
        document.getElementById("report-popup").style.display = "none";
        startGame(currentSelectedDiff);
    }

    function actionGoMainScreen() {
        document.getElementById("report-popup").style.display = "none";
        document.getElementById("app").style.display = "none";
        document.getElementById("intro-screen").style.display = "block";
    }
</script>
